name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libsdl2-dev libsdl2-image-dev libgl-dev libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build hcc
        run: ./scripts/build-linux.sh --install-hcc --prefix "$HOME/.local"

      - name: Check examples
        # No GPU on the runner: the OpenGL programs get Mesa's llvmpipe
        # software renderer through EGL.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/check.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install libraries
        run: brew install sdl2 sdl2_image

      - name: Build hcc
        run: ./scripts/build-macos.sh --install-hcc --prefix "$HOME/.local"

      - name: Check examples
        # The OpenGL programs are built but not run: SDL's offscreen driver
        # gets OpenGL through EGL, which macOS doesn't have.
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/check.sh --no-gl
