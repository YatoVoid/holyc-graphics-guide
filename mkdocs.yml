site_name: HolyC Graphics Guide
site_description: Build windowed, graphical programs in HolyC on Linux, macOS and WSL2 with hcc, SDL2 and OpenGL.
site_url: https://yatovoid.github.io/holyc-graphics-guide/
repo_url: https://github.com/YatoVoid/holyc-graphics-guide
repo_name: YatoVoid/holyc-graphics-guide
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Build hcc from source: build-from-source.md
      - Quick start: quickstart.md
      - HolyC basics: basics.md
  - Graphics:
      - Graphics and rendering: graphics.md
      - Sprites and 2D: sprites.md
      - 3D overview: 3d-overview.md
      - Sound: audio.md
      - Runtime bindings: runtime-bindings.md
  - Reference:
      - Example programs: examples.md
      - Project layout: project-structure.md
      - Memory arenas: memory-arenas.md
      - Porting from TempleOS: templeos-porting.md
      - Compiler quirks: compiler-quirks.md
      - Profiling: profiling.md
      - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Roadmap: roadmap.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
